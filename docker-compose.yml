services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: genura
      POSTGRES_USER: genura
      POSTGRES_PASSWORD: genura_dev_only
    ports:
      - "5432:5432"
    volumes:
      - genura-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genura -d genura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genura-postgres:
